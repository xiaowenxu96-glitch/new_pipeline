industry: "白酒-品牌价格"
source_file: "D:/SWS/new_pipeline/食品饮料/食品饮料20260525dqk修正_白酒主要品牌价格数据（今日酒价）20260208_20260526161224.xlsx"
target_file: "D:/SWS/new_pipeline/食品饮料/白酒主要品牌价格数据目标文档.xlsx"
output_dir: "D:/SWS/new_pipeline/食品饮料/output"

sheets:
  # ==================== 各酒厂主要产品 ====================
  # 源产品名与目标表头基本一致，只有"茅台生肖"在源数据中不存在 → 留空
  - sheet_name: "各酒厂主要产品"
    source_sheet: "各酒厂主要产品"
    data_start_row: 9
    date_col: "H"
    header_read_row: 8
    max_data_cols: 56
    actions:
      - type: "baijiu_write_sheet"

  # ==================== 飞天100ml 和 飞天1L原箱 ====================
  - sheet_name: "飞天100ml 和 飞天1L原箱"
    source_sheet: "飞天100ml和飞天1L原箱"
    data_start_row: 8
    date_col: "F"
    header_read_row: 6
    max_data_cols: 2
    manual_map:
      飞天(散): "飞天100ml"
      公斤茅台(原): "飞天1L原箱(右）"
    actions:
      - type: "baijiu_write_sheet"

  # ==================== 白酒品牌批价（今日酒价） ====================
  - sheet_name: "白酒品牌批价（今日酒价）"
    source_sheet: "白酒品牌批价（今日酒价）"
    data_start_row: 7
    date_col: "H"
    header_read_row: 6
    max_data_cols: 56
    manual_map:
      当年原装: "飞天（整箱）"
      当年散装: "飞天（散瓶）"
      十五年: "茅台15年"
      精品茅台: "茅台精品（整）"
      王子(酱香经典): "王子普王"
      迎宾(紫): "茅台迎宾酒"
      汉酱(普): "汉酱（51%）"
      普五(八代): "普五（八代）"
      五粮液: "五粮液（39%）"
      特曲(老字号): "特曲"
      典藏: "新典藏大师"
      井台25周年纪念: "井台"
      内参: "酒鬼内参"
      红坛: "酒鬼红坛"
      M6+: "梦之蓝M6+"
      M3(水晶版): "梦之蓝水晶版"
      天之蓝: "天之蓝（52%）"
      海之蓝: "海之蓝（52%）"
      青花郎: "青花郎20"
      龙酒: "国台龙酒"
      十五年(国台): "国台十五年"
      国标2020: "国台国标"
      珍30: "珍三十"
      珍15: "珍十五"
      摘要(珍品): "金沙摘要"
      老国宾: "钓鱼台国宾"
      # 以下源中有、目标表中没有对应列 → 自动跳过
    actions:
      - type: "baijiu_write_sheet"

  # ==================== 白酒品牌批价 (酒价参考) ====================
  - sheet_name: "白酒品牌批价 (酒价参考)"
    source_sheet: "白酒品牌批价 (酒价参考)"
    data_start_row: 7
    date_col: "I"
    header_read_row: 6
    max_data_cols: 29
    manual_map:
      飞天(整25年): "飞天（整箱）"
      飞天(散25年): "飞天（散瓶）"
      茅台15年: "茅台15年"
      茅台精品(整): "茅台精品（整）"
      茅台王子普王: "王子普王"
      茅台迎宾酒: "茅台迎宾酒"
      茅台1935: "茅台1935"
      贵州遵义1935: "遵义1935"
      汉酱51°: "汉酱（51%）"
      仁酒53°: "仁酒"
      五粮液八代: "普五（八代）"
      五粮液1618: "五粮液1618"
      五粮液39°: "五粮液（39%）"
      五粮春50°: "五粮春"
      国窖1573 52°: "国窖1573"
      泸州老窖30年52°: "窖龄30"
      泸州老窖60年52°: "窖龄60"
      泸州老窖特曲52°: "特曲"
      泸州老窖头曲52°: "头曲"
      汾酒青花30 53°: "青花30"
      汾酒青花20 53°: "青花20"
      老白汾10 53°: "老白汾10"
      老白汾15 53°: "老白汾15"
      汾酒玻汾: "玻汾（53%475ml）"
      梦之蓝M6+ 52°: "梦之蓝M6+"
      天之蓝52°: "天之蓝（52%）"
      海之蓝52°: "海之蓝（52%）"
    actions:
      - type: "baijiu_write_sheet"

finalize_actions:
  - action: "baijiu_finalize_charts"
