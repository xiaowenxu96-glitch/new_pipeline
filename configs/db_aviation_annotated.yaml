# 航空行业数据库处理配置（带注释版）
# 说明：
# 1. 本文件是 `db_aviation.yaml` 的注释副本，不覆盖原文件。
# 2. 配置驱动 `PipelineEngine` 依次处理每个航空公司工作表。
# 3. 每个 `indicators` 映射表示：源指标ID -> 目标模板写入列。
# 4. `actions` 定义主处理流程，`post_processes` 定义写入后的清理与格式修正。
#
# 整体业务流程：
# - 从 `source_file` 指定的源 Excel 中读取指标数据
# - 将数据写入 `target_file` 模板中的对应工作表
# - 生成季度、YTD、同比、同比差值、2019 对比等派生结果
# - 将结果输出到 `output_dir` 中的目标文件副本

# 行业标识，仅用于日志和任务识别
industry: "交运-航空"

# 源数据文件：包含航空月度原始指标
source_file: "D:/SWS/new_pipeline/交运_航空/交通运输新增指标未比对20250512_航空_航空月度数据_20250619090735.xlsx"

# 目标模板文件：将数据与公式写入该 Excel 模板
target_file: "D:/SWS/new_pipeline/交运_航空/交运航空目标文档.xlsx"

# 输出目录：程序会先复制目标模板，再把处理结果保存到这里
output_dir: "D:/SWS/new_pipeline/交运_航空files"

# 默认参数：
# - start_date: 只处理该日期及之后的数据
# - date_format: 写入 Excel 时间列时使用的格式
# - start_row: 月度明细写入起始行
defaults:
  start_date: "2014-01-01"
  date_format: "yyyy-mm"
  start_row: 4

# 工作表配置列表：
# 每个元素对应目标模板中的一个航空公司 Sheet
sheets:
  # 中国国航：源 Sheet 与目标 Sheet 同名
  - sheet_name: "中国国航"
    source_sheet: "中国国航"

    # 指标映射：指标代码 -> 目标列字母
    # 这些列用于写入月度基础值，后续部分列会基于相邻原值列生成同比/差值公式
    indicators:
      "AA000058863400": "B"
      "AA000058863500": "E"
      "AA000058863600": "H"
      "AA000058863700": "K"
      "AA000058869400": "N"
      "AA000058869500": "Q"
      "AA000058869600": "T"
      "AA000058869700": "W"
      "AA000058873400": "Z"
      "AA000058873500": "AC"
      "AA000058873600": "AF"
      "AA000058873700": "AI"
      "AA000058877400": "AL"
      "AA000058877500": "AO"
      "AA000058877600": "AR"
      "AA000058877700": "AU"
      "AA000064091900": "AX"

    # 主处理动作，按顺序执行：
    # 1. 写入基础月度数据，并生成季度/YTD汇总
    # 2. 生成同比公式
    # 3. 生成同比差值公式
    # 4. 生成相对 2019 的同比公式
    # 5. 生成相对 2019 的差值公式
    actions:
      - type: "aviation_write_airline_sheet"

      # 同比公式列：通常取左侧原值列作为分子，与去年同期进行比较
      - type: "aviation_apply_yoy_formulas"
        target_cols: ["C", "F", "I", "L", "O", "R", "U", "X", "AA", "AD", "AG", "AJ", "AY"]
        start_row: 16

      # 同比差值列：通常取左侧原值列减去去年同期值
      - type: "aviation_apply_yoy_diff_formulas"
        target_cols: ["AM", "AP", "AS", "AV"]
        start_row: 16

      # 相比 2019 的同比公式列
      - type: "aviation_apply_yoy19_formulas"
        target_cols: ["D", "G", "J", "M", "P", "S", "V", "Y", "AB", "AE", "AH", "AK", "AZ"]
        start_row: 112

      # 相比 2019 的差值公式列
      - type: "aviation_apply_diff19_formulas"
        target_cols: ["AN", "AQ", "AT", "AW"]
        start_row: 112

    # 后处理动作：
    # - 清理不需要展示的早年公式
    # - 修正全年之后区域的百分比显示格式
    # - 清除 YTD 中 2018 年差值的特殊脏数据
    # - 清除模板特殊列 AX/AY/AZ 的残留值
    post_processes:
      - action: "aviation_clear_early_years_data"
        params:
          yoy_cols: ["C", "F", "I", "L", "O", "R", "U", "X", "AA", "AD", "AG", "AJ", "AY"]
          yoy19_cols: ["D", "G", "J", "M", "P", "S", "V", "Y", "AB", "AE", "AH", "AK", "AZ"]

      - action: "aviation_adjust_format_after_full_year"
        params:
          yoy_cols: ["C", "F", "I", "L", "O", "R", "U", "X", "AA", "AD", "AG", "AJ", "AY"]
          yoy19_cols: ["D", "G", "J", "M", "P", "S", "V", "Y", "AB", "AE", "AH", "AK", "AZ"]

      - action: "aviation_clear_ytd_2018_diff_data"
        params:
          yoy_diff_cols: ["AM", "AP", "AS", "AV"]

      - action: "aviation_clear_ax_ay_az_columns"

  # 中国东航：目标 Sheet 为“中国东航”，源数据 Sheet 为“东方航空”
  - sheet_name: "中国东航"
    source_sheet: "东方航空"
    indicators:
