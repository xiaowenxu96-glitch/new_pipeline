      "AA000058721800": "AO"
      "AA000058721900": "AR"
      "AA000063553900": "AU"
      "AA000063567400": "AX"
    actions:
      - type: "aviation_write_airline_sheet"
      - type: "aviation_apply_yoy_formulas"
        target_cols: ["C", "F", "I", "L", "O", "R", "U", "X", "AA", "AD", "AG", "AJ", "AY"]
        start_row: 16
      - type: "aviation_apply_yoy_diff_formulas"
        target_cols: ["AM", "AP", "AS", "AV"]
        start_row: 16
      - type: "aviation_apply_yoy19_formulas"
        target_cols: ["D", "G", "J", "M", "P", "S", "V", "Y", "AB", "AE", "AH", "AK", "AZ"]
        start_row: 112
      - type: "aviation_apply_diff19_formulas"
        target_cols: ["AN", "AQ", "AT", "AW"]
        start_row: 112
    post_processes:
      - action: "aviation_clear_early_years_data"
        params:
          yoy_cols: ["C", "F", "I", "L", "O", "R", "U", "X", "AA", "AD", "AG", "AJ", "AY"]
          yoy19_cols: ["D", "G", "J", "M", "P", "S", "V", "Y", "AB", "AE", "AH", "AK", "AZ"]
      - action: "aviation_adjust_format_after_full_year"
        params:
          yoy_cols: ["C", "F", "I", "L", "O", "R", "U", "X", "AA", "AD", "AG", "AJ", "AY"]
          yoy19_cols: ["D", "G", "J", "M", "P", "S", "V", "Y", "AB", "AE", "AH", "AK", "AZ"]
      - action: "aviation_clear_ytd_2018_diff_data"
        params:
